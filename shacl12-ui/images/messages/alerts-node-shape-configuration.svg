<svg xmlns="http://www.w3.org/2000/svg" width="560" height="422" viewBox="0 0 560 422" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="12" y="8" width="536" height="402" rx="8" fill="#ffffff" stroke="#c7cdd4"/>
  <!-- form -->
  <text x="28" y="40" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Edit profile</text>
  <rect x="28" y="58" width="504" height="30" rx="3" fill="#e8f0fb" stroke="none" />
  <rect x="28" y="58" width="3" height="30" fill="#1d5fa8"/>
  <circle cx="46" cy="73" r="7" fill="#1d5fa8"/>
  <text x="46" y="77" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">i</text>
  <text x="60" y="77.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Changes are reviewed before publication.</text>
  <!-- node UI component for ex:alice -->
  <rect x="28" y="100" width="504" height="250" rx="6" fill="#f6f7f9" stroke="#c7cdd4"/>
  <text x="44" y="128" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Alice</text>
  <text x="86" y="128" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="start">Person</text>
  <rect x="44" y="142" width="472" height="30" rx="3" fill="#e8f0fb" stroke="none" />
  <rect x="44" y="142" width="3" height="30" fill="#1d5fa8"/>
  <circle cx="62" cy="157" r="7" fill="#1d5fa8"/>
  <text x="62" y="161" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">i</text>
  <text x="76" y="161.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Records in this dataset are reviewed quarterly.</text>
  <text x="44" y="207" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Name</text>
  <rect x="150" y="186" width="360" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="160" y="207" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Alice</text>
  <text x="44" y="251" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Email</text>
  <rect x="150" y="230" width="360" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="160" y="251" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">alice@work.example</text>
  <text x="150" y="284" font-size="12" fill="#1d5fa8" font-weight="normal" text-anchor="start">+ Add email</text>
  <text x="44" y="327" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Employer</text>
  <rect x="150" y="310" width="64" height="24" rx="12" fill="#f6f7f9" stroke="#c7cdd4" />
  <text x="182" y="327" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="middle">ACME</text>
  <rect x="452" y="364" width="80" height="32" rx="4" fill="#1f2933" stroke="none" />
  <text x="492" y="385" font-size="13" fill="#ffffff" font-weight="normal" text-anchor="middle">Save</text>
  <rect x="360" y="364" width="80" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="400" y="385" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">Cancel</text>
  <rect x="7" y="3" width="546" height="412" rx="6" fill="none" stroke="#1d5fa8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="23" y="95" width="514" height="260" rx="6" fill="none" stroke="#1d5fa8" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
