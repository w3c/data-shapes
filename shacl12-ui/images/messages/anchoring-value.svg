<svg xmlns="http://www.w3.org/2000/svg" width="560" height="422" viewBox="0 0 560 422" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="12" y="8" width="536" height="402" rx="8" fill="#ffffff" stroke="#c7cdd4"/>
  <!-- form -->
  <text x="28" y="40" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Edit profile</text>
  <!-- node UI component for ex:alice -->
  <rect x="28" y="62" width="504" height="288" rx="6" fill="#f6f7f9" stroke="#c7cdd4"/>
  <text x="44" y="90" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Alice</text>
  <text x="86" y="90" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="start">Person</text>
  <text x="44" y="131" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Name</text>
  <rect x="150" y="110" width="360" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="160" y="131" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Alice</text>
  <text x="44" y="175" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Email</text>
  <rect x="150" y="154" width="360" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="160" y="175" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">alice@work.example</text>
  <rect x="150" y="194" width="360" height="32" rx="4" fill="#ffffff" stroke="#b3261e" />
  <text x="160" y="215" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">alice(at)example.org</text>
  <rect x="150" y="232" width="360" height="30" rx="3" fill="#fbe9e7" stroke="none" />
  <rect x="150" y="232" width="3" height="30" fill="#b3261e"/>
  <circle cx="168" cy="247" r="7" fill="#b3261e"/>
  <text x="168" y="251" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">!</text>
  <text x="182" y="251.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Not a valid email address.</text>
  <text x="150" y="284" font-size="12" fill="#1d5fa8" font-weight="normal" text-anchor="start">+ Add email</text>
  <text x="44" y="327" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Employer</text>
  <rect x="150" y="310" width="64" height="24" rx="12" fill="#f6f7f9" stroke="#c7cdd4" />
  <text x="182" y="327" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="middle">ACME</text>
  <rect x="452" y="364" width="80" height="32" rx="4" fill="#1f2933" stroke="none" />
  <text x="492" y="385" font-size="13" fill="#ffffff" font-weight="normal" text-anchor="middle">Save</text>
  <rect x="360" y="364" width="80" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="400" y="385" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">Cancel</text>
  <rect x="145" y="189" width="370" height="78" rx="6" fill="none" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
