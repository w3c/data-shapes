<svg xmlns="http://www.w3.org/2000/svg" width="560" height="384" viewBox="0 0 560 384" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="12" y="8" width="536" height="364" rx="8" fill="#ffffff" stroke="#c7cdd4"/>
  <!-- form -->
  <text x="28" y="40" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Edit profile</text>
  <rect x="28" y="58" width="504" height="30" rx="3" fill="#fbe9e7" stroke="none" />
  <rect x="28" y="58" width="3" height="30" fill="#b3261e"/>
  <circle cx="46" cy="73" r="7" fill="#b3261e"/>
  <text x="46" y="77" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">!</text>
  <text x="60" y="77.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">The employer record is missing a name.</text>
  <!-- node UI component for ex:alice -->
  <rect x="28" y="100" width="504" height="212" rx="6" fill="#f6f7f9" stroke="#c7cdd4"/>
  <text x="44" y="128" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Alice</text>
  <text x="86" y="128" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="start">Person</text>
  <text x="44" y="169" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Name</text>
  <rect x="150" y="148" width="360" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="160" y="169" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Alice</text>
  <text x="44" y="213" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Email</text>
  <rect x="150" y="192" width="360" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="160" y="213" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">alice@work.example</text>
  <text x="150" y="246" font-size="12" fill="#1d5fa8" font-weight="normal" text-anchor="start">+ Add email</text>
  <text x="44" y="289" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Employer</text>
  <rect x="150" y="272" width="64" height="24" rx="12" fill="#f6f7f9" stroke="#c7cdd4" />
  <text x="182" y="289" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="middle">ACME</text>
  <rect x="452" y="326" width="80" height="32" rx="4" fill="#1f2933" stroke="none" />
  <text x="492" y="347" font-size="13" fill="#ffffff" font-weight="normal" text-anchor="middle">Save</text>
  <rect x="360" y="326" width="80" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="400" y="347" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">Cancel</text>
  <rect x="7" y="3" width="546" height="374" rx="6" fill="none" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
