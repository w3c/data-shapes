<svg xmlns="http://www.w3.org/2000/svg" width="560" height="442" viewBox="0 0 560 442" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="12" y="8" width="536" height="422" rx="8" fill="#ffffff" stroke="#c7cdd4"/>
  <!-- form -->
  <text x="28" y="40" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Edit profile</text>
  <!-- node UI component for ex:alice -->
  <rect x="28" y="62" width="504" height="308" rx="6" fill="#f6f7f9" stroke="#c7cdd4"/>
  <text x="44" y="90" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Alice</text>
  <text x="86" y="90" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="start">Person</text>
  <text x="44" y="131" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Name</text>
  <rect x="150" y="110" width="360" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="160" y="131" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Alice</text>
  <text x="44" y="175" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Email</text>
  <rect x="150" y="154" width="360" height="30" rx="3" fill="#e8f0fb" stroke="none" />
  <rect x="150" y="154" width="3" height="30" fill="#1d5fa8"/>
  <circle cx="168" cy="169" r="7" fill="#1d5fa8"/>
  <text x="168" y="173" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">i</text>
  <text x="182" y="173.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Use your work address where possible.</text>
  <rect x="150" y="192" width="360" height="30" rx="3" fill="#fdf3dc" stroke="none" />
  <rect x="150" y="192" width="3" height="30" fill="#8a5a00"/>
  <path d="M168 200 L175.5 213 L160.5 213 Z" fill="#8a5a00"/>
  <text x="168" y="211.5" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">!</text>
  <text x="182" y="211.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">This field becomes mandatory in 2027.</text>
  <rect x="150" y="230" width="360" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="160" y="251" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">alice@work.example</text>
  <text x="150" y="280" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="start">The address we use to contact you.</text>
  <text x="150" y="304" font-size="12" fill="#1d5fa8" font-weight="normal" text-anchor="start">+ Add email</text>
  <text x="44" y="347" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">Employer</text>
  <rect x="150" y="330" width="64" height="24" rx="12" fill="#f6f7f9" stroke="#c7cdd4" />
  <text x="182" y="347" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="middle">ACME</text>
  <rect x="452" y="384" width="80" height="32" rx="4" fill="#1f2933" stroke="none" />
  <text x="492" y="405" font-size="13" fill="#ffffff" font-weight="normal" text-anchor="middle">Save</text>
  <rect x="360" y="384" width="80" height="32" rx="4" fill="#ffffff" stroke="#c7cdd4" />
  <text x="400" y="405" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">Cancel</text>
  <rect x="31" y="149" width="492" height="168" rx="6" fill="none" stroke="#1d5fa8" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
